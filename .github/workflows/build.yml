name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Godot import
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ hashFiles('**/*.tscn', '**/*.gd', '**/*.tres', 'project.godot') }}

      - name: Import project
        run: |
          godot --headless --editor --quit || true
          godot --headless --import || true

      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/DeadOps.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeadOps-APK
          path: build/android/DeadOps.apk
          if-no-files-found: error
